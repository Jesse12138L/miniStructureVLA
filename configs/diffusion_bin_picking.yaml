# 真正的 Diffusion Policy（对齐 real-stanford/diffusion_policy 的结构与数值）。
policy: diffusion

data:
  dataset_path: data/bp_masked.npz
  save_path: checkpoints/diffusion_bp.pt
  resize_to: 128
  chunk_size: 16        # 一次预测 16 步，与原版的 horizon 一致
  normalize: true

model:
  d_model: 128

  diffusion:
    n_action_steps: 8   # 只执行前 8 步就重新规划（原版的 16/8 两段式）
    # 原版是 [512, 1024, 2048]，U-Net 就有 2.56 亿参数，那是给上百万帧的 Robomimic
    # 训的。这里取原版一半的宽度：
    #   条件向量 448 维 / 第一段 256 通道 = 1.8（原版 0.79，之前 [64,...] 时是 7.0）
    #   参数密度 5876/帧，仍低于原版的约 8500/帧
    #   训练显存 1.4GB / 6GB，训练时长约 39 分钟（200 epochs）
    down_dims: [256, 512, 1024]
    num_kp: 32          # spatial softmax 的关键点数，图像特征维 = 2*num_kp
    step_embed_dim: 128

train:
  batch_size: 64
  epochs: 200
  lr: 1.0e-4
  val_split: 0.1
  use_ema: true         # 维护影子权重，验证和选模型都用它
  ema_power: 0.75       # 原版的值
  device: cuda
