# Diffusion Policy on bin-picking-v3, with the structure and the numbers aligned to
# real-stanford/diffusion_policy. See configs/mlp_bin_picking.yaml for the shared setup.
policy: diffusion

data:
  dataset_path: data/bp_masked.npz
  save_path: checkpoints/diffusion_bp.pt
  resize_to: 128
  # For the diffusion policy chunk_size is the prediction *horizon*, not how many
  # actions get executed: act() returns just the first n_action_steps of it. 16 matches
  # the reference's horizon.
  chunk_size: 16
  normalize: true

model:
  d_model: 128

  diffusion:
    n_action_steps: 8   # execute 8 of the 16 predicted steps, then re-plan (the
                        # reference's 16/8 split)
    # The reference uses [512, 1024, 2048], a 256M-parameter U-Net trained on millions of
    # Robomimic frames. Half that width here, which keeps the 448-dim conditioning vector
    # from swamping the first stage: 448/256 = 1.8, against 0.79 at the reference's width.
    down_dims: [256, 512, 1024]
    num_kp: 32          # spatial-softmax keypoints; the image feature is 2*num_kp wide
    step_embed_dim: 128

train:
  batch_size: 64
  epochs: 150
  lr: 1.0e-4
  val_split: 0.1
  use_ema: true         # keep a shadow copy of the weights; validation and model
                        # selection both use it
  ema_power: 0.75       # the reference's value
  device: cuda
