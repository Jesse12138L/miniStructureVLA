# ACT policy on bin-picking-v3. See configs/mlp_bin_picking.yaml for the shared setup.
policy: act

data:
  dataset_path: data/bp_masked.npz
  save_path: checkpoints/act_bp.pt
  resize_to: 128
  chunk_size: 20        # actions predicted *and executed* per plan. A bin-picking episode
                        # runs ~116 steps, so the reference's 100 would leave most chunks
                        # filled entirely with padding
  normalize: true       # z-score state and actions; the statistics go in the checkpoint

model:
  d_model: 128          # the reference uses 512, but there are only 11.5k steps here and
                        # that width overfits
  act:
    n_heads: 4          # at d_model=128, 8 heads would leave only 16 dims per head
    n_enc_layers: 2
    dim_feedforward: 512  # the usual 4x; the reference uses 6.25x
    latent_dim: 16        # VAE latent. The scripted expert is close to unimodal, so the
                          # reference's 32 is oversized
    kl_weight: 10.0       # the value the reference settled on
    # The decoder is fixed at 1 layer. The reference configures 7 but only ever uses
    # layer 0, because of its return_intermediate_dec bug.

train:
  batch_size: 64
  epochs: 150
  lr: 1.0e-4            # the reference's 1e-5 is tuned for an 80M-parameter model; this
                        # one has ~1.2M
  val_split: 0.1
  device: cuda
